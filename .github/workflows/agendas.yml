name: Atualizar agendas para assinar

on:
  schedule:
    - cron: "17 8,20 * * *"   # 05h17 e 17h17 em Brasília
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/gerar_agendas.py"
      - ".github/workflows/agendas.yml"

permissions:
  contents: write

concurrency:
  group: agendas
  cancel-in-progress: false

jobs:
  gerar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Gerar arquivos de agenda a partir da planilha
        run: python scripts/gerar_agendas.py
      - name: Publicar se algo mudou
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add agendas
          if git diff --cached --quiet; then
            echo "Nada mudou."
          else
            git commit -m "Atualiza agendas para assinar"
            git push
          fi
